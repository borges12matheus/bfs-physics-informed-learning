experiment:
  name: prepare_v1
  type: k_sst
  seed: 42

paths:
  root: .
  data_process_dir: data/data_processed
  data_cfd_dir: data/cfd
  results_dir: results
  models_dir: results/models
  metrics_dir: results/metrics
  plots_dir: results/plots
  logs_dir: logs

cfd_data:
  input_format: csv       # auto, raw ou csv
  path_coarse: cfd_rans_sst/Re_5100/coarse/
  path_fine: cfd_rans_sst/Re_5100/fine/
  dataset: grid_pinn_k_nut_omega_p_U.xy
  dataset_csv: grid_pinn_k_nut_omega_p_U.csv
  csv_separator: ","
  Re: 5100
  out_name: dataset_bfs_2d_sst_Re5100_full.parquet

features:
  - x
  - y
  - Ux
  - Uy
  - p
  - omega
  - k
  - nut_log
  - wz_log
  - sxy_log
  - div_u_log
  - Re
  - Re_norm

targets:
  - dUx
  - dUy
  - dp
